    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#mint)"/>

  <text x="1075" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="260" font-weight="900" fill="#FFFFFF" fill-opacity="0.05">Z</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="106" fill="#6E7686" font-size="13" font-weight="600" letter-spacing="4.6">PERSONAL PROFILE · EST. 2026</text>
    <text x="68" y="188" fill="url(#name)" font-size="72" font-weight="800" letter-spacing="-2">Zz-0005</text>
    <text x="72" y="232" fill="#97A1B4" font-size="21" font-weight="400">Built one commit at a time.</text>
    <text x="72" y="262" fill="#5F6779" font-size="16" font-weight="400">一点一点，把它填满</text>
